version: "3"
services:
  jupyter:
    build: .
    container_name: jupyter_lab_uv
    ports:
      - "8888:8888"
    volumes:
      - ./repos:/app/repos  # Mount your local repos into /app/repos in the container
    environment:
      - PYTHONUNBUFFERED=1
    # Optionally, set the UID/GID if you want to match the host user for file permissions
    # user: "1000:1000"
